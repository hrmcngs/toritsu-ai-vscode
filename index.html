<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust Demo</title>
    <style>
      body {
        font-family: sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f7f7f7;
      }
      main {
        background: #fff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
      }
      p {
        margin: 0;
        color: #444;
      }
      code {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 8px;
        background: #f0f0f0;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rust Demo</h1>
      <p>この画面は静的ファイルです。Rustサーバーを起動して <code>http://127.0.0.1:3000/</code> にアクセスしてください。</p>
      <p style="margin-top: 12px;">hello world</p>
    </main>
  </body>
</html>
